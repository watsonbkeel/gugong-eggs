<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>故宫金蛋 · 老师控制台</title>
<style>
  :root { --gold:#f5c542; --bg:#14110d; --panel:#1f1a13; --line:#3a3125; --text:#f4ead6; --dim:#a8997c; --ok:#6fcf7a; --bad:#e86b5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:18px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { margin:0; font-size:24px; color:var(--gold); letter-spacing:2px; }
  button { font:inherit; border:0; border-radius:10px; padding:10px 22px; cursor:pointer; background:#3b3225; color:var(--text); }
  button:hover:not(:disabled) { filter:brightness(1.2); }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button.primary { background:var(--gold); color:#2b2006; font-weight:700; }
  button.danger { background:#7a2f26; }
  select { font:inherit; padding:9px 12px; border-radius:10px; background:#2a2318; color:var(--text); border:1px solid var(--line); }
  main { flex:1; display:grid; grid-template-columns: 300px 1fr 360px; gap:16px; padding:16px 22px; min-height:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; overflow:auto; }
  .panel h2 { margin:0 0 10px; font-size:16px; color:var(--dim); font-weight:600; letter-spacing:1px; }
  #empty { grid-column:1 / -1; text-align:center; padding:80px 20px; color:var(--dim); font-size:22px; }
  #room { display:none; }
  .code { font-size:96px; font-weight:800; color:var(--gold); letter-spacing:12px; line-height:1; text-align:center; }
  .center { display:flex; flex-direction:column; gap:14px; align-items:center; }
  #qr { background:#fff; padding:10px; border-radius:12px; line-height:0; }
  #qr svg, #qr img { width:220px; height:220px; display:block; }
  #url { font-size:14px; color:var(--dim); word-break:break-all; text-align:center; }
  .phase { font-size:20px; padding:4px 16px; border-radius:20px; background:#3b3225; }
  .phase.running { background:#2c5a34; } .phase.ended { background:#5a2c2c; }
  .timer { font-size:72px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .hint { width:100%; background:#17130d; border:1px dashed var(--line); border-radius:10px; padding:10px 14px; font-size:17px; }
  .hint b { color:var(--gold); }
  .eggline { width:100%; display:flex; gap:10px; align-items:center; justify-content:space-between; background:#2a2008; border-radius:10px; padding:10px 14px; }
  .eggline .name { font-weight:700; color:var(--gold); }
  .eggline .name.hide { filter:blur(8px); user-select:none; }
  ol, ul { margin:0; padding:0; list-style:none; }
  li.row { display:flex; justify-content:space-between; gap:8px; padding:7px 4px; border-bottom:1px solid #2b241a; }
  li.row .l { display:flex; gap:8px; align-items:center; min-width:0; }
  li.row .nick { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li.row .loc { color:var(--dim); font-size:14px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; flex:none; display:inline-block; }
  .dot.on { background:var(--ok); }
  .rank { display:flex; gap:10px; align-items:center; padding:9px 6px; border-bottom:1px solid #2b241a; font-size:20px; }
  .rank .n { width:34px; height:34px; border-radius:50%; background:#3b3225; display:grid; place-items:center; font-weight:800; flex:none; }
  .rank.r1 .n { background:#f5c542; color:#2b2006; } .rank.r2 .n { background:#c9ced6; color:#222; } .rank.r3 .n { background:#c98a4e; color:#2b1706; }
  .rank .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank .tm { font-variant-numeric:tabular-nums; color:var(--dim); }
  .rank.wait { opacity:.5; font-size:17px; }
  .big .rank { font-size:30px; padding:14px 8px; } .big .rank .n { width:48px; height:48px; }
  footer { border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--dim); font-size:15px; }
  .chip { padding:5px 14px; border-radius:18px; background:#2a2318; border:1px solid var(--line); color:var(--text); cursor:pointer; }
  .chip.cur { border-color:var(--gold); color:var(--gold); }
  .chip.nokey { opacity:.45; cursor:not-allowed; }
  #toast { position:fixed; left:50%; top:20px; transform:translateX(-50%); background:#7a2f26; color:#fff; padding:10px 22px; border-radius:10px; display:none; z-index:9; }
  @media (max-width: 1100px) { main { grid-template-columns:1fr; } .code { font-size:72px; } }
</style>
</head>
<body>
<header>
  <h1>故宫金蛋 · 老师控制台</h1>
  <button class="primary" id="btnNew">新建房间</button>
  <span id="conn" style="color:var(--dim);font-size:15px"></span>
</header>

<main>
  <div id="empty" class="panel">点“新建房间”，得到房间码和二维码，投屏给大家扫码。</div>

  <section class="panel" id="room-left">
    <h2>玩家 <span id="pcount"></span></h2>
    <ul id="players"></ul>
  </section>

  <section class="panel center" id="room-mid">
    <div class="code" id="code">----</div>
    <div id="qr"></div>
    <div id="url"></div>
    <span class="phase" id="phase">等待开局</span>
    <div class="timer" id="timer">--:--</div>
    <div class="bar">
      <select id="dur"><option value="3">3 分钟</option><option value="5" selected>5 分钟</option><option value="8">8 分钟</option></select>
      <input type="number" id="eggCount" min="1" max="3" value="1" style="width:60px;padding:9px 12px;border-radius:10px;background:#2a2318;color:var(--text);border:1px solid var(--line);font:inherit" title="金蛋数量">
      <button class="primary" id="btnStart">开始</button>
      <button class="danger" id="btnEnd">结束</button>
      <button id="btnReset">再来一局</button>
    </div>
    <div class="hint" id="hint">提示：—</div>
    <div id="egglines"></div>
  </section>

  <section class="panel" id="room-right">
    <h2>排行榜 <span id="fcount"></span></h2>
    <ol id="rank"></ol>
  </section>
</main>

<footer>
  <span id="global">服务器：—</span>
  <span>房间：</span>
  <span id="rooms"></span>
</footer>
<div id="toast"></div>

<script src="vendor/qrcode.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const LS = 'gugong-host-rooms';          // { [code]: hostToken }
  const LS_LAST = 'gugong-host-last';
  const store = () => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } };
  const saveStore = (o) => localStorage.setItem(LS, JSON.stringify(o));

  let cfg = { gameUrl: 'http://localhost:5173/', wsUrl: '' };
  let ws = null, curCode = null, state = null, offset = 0, eggShown = false, retry = 0, reconnectTimer = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (ms) => { ms = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(ms / 60)}:${String(ms % 60).padStart(2, '0')}`; };
  const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), 3000); };

  function wsUrl() {
    if (cfg.wsUrl) return cfg.wsUrl;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    // 直连：/host/ 与 ws 同端口；经 Nginx 的 /gugong-host/ 页面，则 ws 走 /gugong-ws/
    const path = /-host\/?$/.test(location.pathname) ? location.pathname.replace(/-host\/?$/, '-ws/') : '/';
    return `${proto}//${location.host}${path}`;
  }

  async function loadCfg() {
    try { cfg = { ...cfg, ...(await (await fetch('config.json')).json()) }; } catch { /* 用默认 */ }
  }

  async function newRoom() {
    try {
      const r = await fetch('api/rooms', { method: 'POST' });
      const j = await r.json();
      if (!r.ok) return toast('建房失败：' + (j.error || r.status));
      const s = store(); s[j.code] = j.hostToken; saveStore(s);
      enter(j.code);
    } catch { toast('连不上服务器'); }
  }

  function enter(code) {
    const tok = store()[code];
    if (!tok) return toast('没有这个房间的口令（不是在本机建的）');
    curCode = code; localStorage.setItem(LS_LAST, code);
    state = null; eggShown = false; retry = 0;
    $('empty').style.display = 'none';
    for (const id of ['room-left', 'room-mid', 'room-right']) $(id).style.display = '';
    $('code').textContent = code;
    drawQr(code);
    connect();
    render();
  }

  function drawQr(code) {
    const url = new URL(cfg.gameUrl, location.href);
    url.searchParams.set('room', code);
    $('url').textContent = url.href;
    try {
      const qr = qrcode(0, 'M'); qr.addData(url.href); qr.make();
      $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    } catch (e) { $('qr').textContent = '二维码生成失败'; }
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (ws) { ws.onclose = null; try { ws.close(); } catch { /* ignore */ } }
    const code = curCode, tok = store()[code];
    $('conn').textContent = '连接中…';
    ws = new WebSocket(wsUrl());
    ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ type: 'join', room: code, role: 'host', token: tok })); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'welcome' && m.state) { setState(m.state); $('conn').textContent = '已连接'; }
      else if (m.type === 'room_state') { setState(m); $('conn').textContent = '已连接'; }
      else if (m.type === 'error') {
        toast(m.message || m.code);
        if (m.code === 'room_not_found' || m.code === 'bad_token') { const s = store(); delete s[code]; saveStore(s); showEmpty(); }
      }
    };
    ws.onclose = () => {
      $('conn').textContent = '连接断开，重连中…';
      if (curCode !== code) return;
      retry++; reconnectTimer = setTimeout(connect, Math.min(10000, 1000 * 2 ** Math.min(retry, 4)));
    };
  }

  function showEmpty() {
    curCode = null; state = null;
    $('empty').style.display = '';
    for (const id of ['room-left', 'room-mid', 'room-right']) $(id).style.display = 'none';
  }

  function setState(s) { state = s; offset = s.serverTime - Date.now(); render(); }

  function send(type, extra = {}) {
    if (!ws || ws.readyState !== 1) return toast('未连接');
    ws.send(JSON.stringify({ type, code: curCode, hostToken: store()[curCode], ...extra }));
  }

  function render() {
    if (!curCode) return;
    const s = state;
    if (!s) return;
    const phase = s.phase;
    const ph = $('phase');
    ph.className = 'phase ' + phase;
    ph.textContent = { waiting: '等待开局', running: '进行中', ended: '已结束' }[phase];
    $('btnStart').disabled = phase !== 'waiting';
    $('btnEnd').disabled = phase !== 'running';
    $('btnReset').disabled = phase === 'waiting';
    $('dur').disabled = phase !== 'waiting';
    $('eggCount').disabled = phase !== 'waiting';
    if (phase === 'waiting') $('dur').value = String(Math.round(s.durationMs / 60000)) || '5';

    // 提示：每个蛋当前解锁到第几级，逐条列出来
    const eggsAll = s.eggs || [];
    const hintParts = [];
    for (let i = 0; i < eggsAll.length; i++) {
      const e = eggsAll[i];
      const lv = e && typeof e.hintLevel === 'number' ? e.hintLevel : -1;
      if (lv < 0) continue;
      const last = e.hints && e.hints.length ? e.hints[e.hints.length - 1] : '';
      if (!last) continue;
      hintParts.push(`${eggsAll.length > 1 ? `蛋${i + 1} ` : ''}<b>${lv + 1}/5</b>：${esc(last)}`);
    }
    $('hint').innerHTML = hintParts.length ? `提示 ${hintParts.join('　|　')}` : '提示：—';

    // 金蛋（多个）
    const eggs = s.eggs || [];
    let html = '';
    for (let i = 0; i < eggs.length; i++) {
      const e = eggs[i];
      const name = e ? `${e.area} · ${e.hall} · ${e.corner}` : '—';
      const hideClass = eggShown ? '' : ' hide';
      html += `<div class="eggline"><span>金蛋 ${i+1}：<span class="name${hideClass}">${name}</span></span></div>`;
    }
    $('egglines').innerHTML = html || '<div class="eggline"><span>金蛋：—</span></div>';

    // 玩家
    const ps = s.players || [];
    const eggTotal = eggs.length;
    const statOf = (p) => {
      const fe = p.foundEggs || [];
      const lastAt = fe.length ? fe[fe.length - 1].at : 0;
      return { cnt: fe.length, totalMs: lastAt ? lastAt - s.startedAt : 0 };
    };
    $('pcount').textContent = `（${ps.filter((p) => p.online).length} 在线 / ${ps.length}）`;
    $('players').innerHTML = ps.map((p) => {
      const { cnt } = statOf(p);
      const foundText = cnt > 0 ? `✔ ${cnt}/${eggTotal}` : '';
      return `<li class="row"><span class="l"><span class="dot ${p.online ? 'on' : ''}"></span><span class="nick">${esc(p.nick)}</span></span><span class="loc">${foundText || esc(p.loc || '')}</span></li>`;
    }).join('') || '<li class="row"><span class="loc">还没有人进房</span></li>';

    // 排行榜（多蛋：按找到数量倒序，相同数量按最后一个蛋的时间升序）
    const ranked = ps.map((p) => ({ ...p, ...statOf(p) })).filter((p) => p.cnt > 0)
      .sort((a, b) => b.cnt !== a.cnt ? b.cnt - a.cnt : a.totalMs - b.totalMs);
    for (let i = 0; i < ranked.length; i++) ranked[i].rank = i + 1;
    const rest = ps.filter((p) => statOf(p).cnt === 0);
    $('fcount').textContent = phase === 'waiting' ? '' : `（${ranked.length}/${ps.length}）`;
    $('rank').innerHTML = ranked.map((p) => `<li class="rank r${p.rank}"><span class="n">${p.rank}</span><span class="nm">${esc(p.nick)}</span><span class="tm">${p.cnt}/${eggTotal} · ${fmt(p.totalMs || 0)}</span></li>`).join('')
      + rest.map((p) => `<li class="rank wait"><span class="n">·</span><span class="nm">${esc(p.nick)}</span><span class="tm">${phase === 'waiting' ? '' : '寻找中'}</span></li>`).join('');
    $('room-right').classList.toggle('big', phase === 'ended');

    // 全局
    const g = s.global;
    if (g) {
      $('global').textContent = `进行中的房间 ${g.running} / ${g.maxRunning}`;
      const mine = store();
      $('rooms').innerHTML = g.rooms.map((r) => {
        const st = { waiting: '等待', running: '进行中', ended: '已结束' }[r.phase];
        const cls = (r.code === curCode ? 'cur ' : '') + (mine[r.code] ? '' : 'nokey');
        return `<span class="chip ${cls}" data-code="${r.code}">${r.code} · ${r.online}人 · ${st}</span>`;
      }).join(' ');
    }
    tick();
  }

  function tick() {
    const s = state; if (!s) return;
    const now = Date.now() + offset;
    let txt = '--:--';
    if (s.phase === 'waiting') txt = fmt(s.durationMs);
    else if (s.phase === 'running') txt = now < s.startedAt ? '倒数 ' + Math.ceil((s.startedAt - now) / 1000) : fmt(s.endsAt - now);
    else txt = '00:00';
    $('timer').textContent = txt;
  }

  $('btnNew').onclick = newRoom;
  $('btnStart').onclick = () => send('host_start', { durationMs: Number($('dur').value) * 60000, eggCount: Math.max(1, Math.min(3, Number($('eggCount').value) || 1)) });
  $('btnEnd').onclick = () => { if (confirm('确定提前结束这一局？')) send('host_end'); };
  $('btnReset').onclick = () => send('host_reset');
  $('egglines').onclick = () => { eggShown = !eggShown; render(); };
  $('rooms').onclick = (ev) => { const c = ev.target.closest('.chip'); if (!c) return; const code = c.dataset.code; if (code === curCode) return; enter(code); };
  setInterval(tick, 200);

  (async () => {
    await loadCfg();
    showEmpty();
    const last = localStorage.getItem(LS_LAST);
    if (last && store()[last]) enter(last);
  })();
})();
</script>
</body>
</html>
